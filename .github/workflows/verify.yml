name: Verify plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: node qa/pomodoro-browser.mjs
      - run: node qa/pomodoro-strip-browser.mjs
      - run: node qa/calendar-timer-browser.mjs
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-verification
          path: |
            qa/large-calendar-output/VERIFY.json
            qa/large-calendar-output/*.png
            qa/pomodoro-output/result.json
            qa/pomodoro-output/*.png
            qa/pomodoro-strip-output/result.json
            qa/pomodoro-strip-output/*.png
            qa/calendar-timer-output/VERIFY.json
            qa/calendar-timer-output/*.png
            release/*
          if-no-files-found: ignore
